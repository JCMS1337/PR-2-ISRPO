plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = '23'
    targetCompatibility = '23'
}

application {
    mainClass = 'org.example.TodoApp'
}

shadowJar {
    archiveBaseName = 'todo-app'
    archiveClassifier = ''
    archiveVersion = project.version.toString()
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.build {
    dependsOn shadowJar
}

// The application plugin's distribution tasks consume the shadow jar as the
// project artifact, so they must depend on it explicitly.
tasks.named('startScripts') {
    dependsOn 'shadowJar'
}

tasks.named('distTar') {
    dependsOn 'shadowJar'
}

tasks.named('distZip') {
    dependsOn 'shadowJar'
}

test {
    useJUnitPlatform()
}
