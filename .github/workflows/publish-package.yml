name: "Publish to GitHub Packages (Maven)"

on:
  workflow_run:
    workflows: ["CI / Build & Release"]
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: project
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # GitHub Packages (Maven) is immutable: re-publishing an existing version
      # fails with HTTP 409. Since this workflow runs after every successful CI
      # on main (not only on version bumps), skip when the version is already there.
      - name: Check if version is already published
        id: check
        run: |
          VERSION="${{ steps.project.outputs.version }}"
          URL="https://maven.pkg.github.com/JCMS1337/PR-2-ISRPO/org/example/todo-app/${VERSION}/todo-app-${VERSION}.pom"
          # -L follows the redirect GitHub Packages returns for an existing
          # artifact; treat either that redirect (302) or the final response
          # (200) as "already published". Non-existent versions yield 404.
          CODE=$(curl -sL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$URL")
          echo "Maven registry responded with HTTP ${CODE} for ${URL}"
          if [ "${CODE}" = "200" ] || [ "${CODE}" = "302" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published - skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.check.outputs.skip != 'true'
        run: ./gradlew publish
